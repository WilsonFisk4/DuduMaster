name: Run Telegram Bot

on:
  push:
    branches: [main]
  schedule:
    # Uruchamia akcję automatycznie co 5 godzin (zabezpieczenie przed limitem czasu GitHub Actions)
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Uruchom bota
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
